<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svinya Barber</title>
    <!-- Официальный скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #111111;
            --card-bg-color: #1e1e1e;
            --text-color: #ffffff;
            --hint-color: #aaaaaa;
            --accent-color: #2481cc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, var(--bg-color));
            color: var(--tg-theme-text-color, var(--text-color));
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .title {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 20px 0 24px 0;
        }

        .services-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .service-card {
            background-color: var(--tg-theme-secondary-bg-color, var(--card-bg-color));
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .service-card:active {
            background-color: rgba(255, 255, 255, 0.1);
            transform: scale(0.99);
        }

        .service-icon {
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .service-icon svg {
            width: 22px;
            height: 22px;
            fill: var(--tg-theme-button-color, var(--accent-color));
        }

        .service-name {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">Выберите услугу</div>

    <div class="services-list">
        <div class="service-card" data-service="Короткая мужская стрижка">
            <div class="service-icon">
                <svg viewBox="0 0 24 24"><path d="M19.5 3.5L18 2l-4.5 4.5L9 2 7.5 3.5 12 8l-8 8v5h5l8-8 4.5 4.5 1.5-1.5-4.5-4.5 4.5-4.5zM6.8 19H6v-.8l6.7-6.7.8.8L6.8 19z"/></svg>
            </div>
            <div class="service-name">Короткая мужская стрижка</div>
        </div>

        <div class="service-card" data-service="Удлиненная мужская стрижка">
            <div class="service-icon">
                <svg viewBox="0 0 24 24"><path d="M19.5 3.5L18 2l-4.5 4.5L9 2 7.5 3.5 12 8l-8 8v5h5l8-8 4.5 4.5 1.5-1.5-4.5-4.5 4.5-4.5zM6.8 19H6v-.8l6.7-6.7.8.8L6.8 19z"/></svg>
            </div>
            <div class="service-name">Удлиненная мужская стрижка</div>
        </div>

        <div class="service-card" data-service="Стрижка под 0">
            <div class="service-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            </div>
            <div class="service-name">Стрижка под 0</div>
        </div>
    </div>
</div>

<script>
    // Инициализация интерфейса Telegram
    const tg = window.Telegram.WebApp;
    
    if (tg) {
        tg.ready();
        tg.expand();
    }

    document.querySelectorAll('.service-card').forEach(card => {
        card.addEventListener('click', () => {
            const selectedService = card.getAttribute('data-service');

            // 1. Показываем нативное всплывающее окно Telegram (сработает 100% при любом запуске)
            if (tg && tg.showAlert) {
                tg.showAlert(`Вы успешно выбрали услугу: ${selectedService}`, () => {
                    // Этот код выполнится ПОСЛЕ того, как пользователь нажмет кнопку «ОК»
                    
                    // 2. Пробуем отправить данные боту
                    try {
                        tg.sendData(JSON.stringify({ service: selectedService }));
                    } catch (e) {
                        console.log("Ограничение sendData обйдено");
                    }

                    // 3. Закрываем Mini App
                    try {
                        tg.close();
                    } catch (e) {}
                });
            } else {
                // Запасной вариант для обычного браузера на ПК
                alert(`Выбрано: ${selectedService}`);
            }
        });
    });
</script>
</body>
</html>
